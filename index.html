<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TOEIC Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141428; --card:#1f1f3d; --card2:#2a2a52; --text:#f4f3ff; --muted:#a9a7cf;
  --g:#ffb547; --v:#4fd1c5; --r:#b388ff; --ok:#3ddc84; --bad:#ff5c7a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Prompt',system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#2b2160 0,var(--bg) 55%);color:var(--text);
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 20px);min-height:100%;user-select:none}
.wrap{max-width:480px;margin:0 auto}
.hidden{display:none!important}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}

/* HOME */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font-weight:800;font-size:24px;letter-spacing:.5px}
.logo span{color:var(--g)}
.streak{background:var(--card);padding:6px 12px;border-radius:99px;font-weight:600;font-size:14px}
.profile{background:linear-gradient(135deg,#3a2f80,#26245a);border-radius:22px;padding:18px;margin-bottom:18px;box-shadow:0 8px 24px #0005}
.lvrow{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.lv{font-size:30px;font-weight:800;line-height:1}
.rank{font-size:13px;color:var(--muted);margin-top:4px}
.xptxt{font-size:13px;color:var(--muted);text-align:right}
.bar{height:12px;background:#0004;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),#ff7a59);border-radius:99px;transition:width .6s}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:#0003;border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px}
.stat small{font-size:11px;color:var(--muted)}
h3{font-size:15px;color:var(--muted);font-weight:500;margin:4px 4px 10px}
.mode{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;text-align:left;
  border:2px solid transparent;transition:transform .1s}
.mode:active{transform:scale(.97)}
.mode .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex-shrink:0}
.mode b{font-size:18px;display:block}
.mode small{color:var(--muted);font-size:13px;line-height:1.4;display:block}
.mode .best{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.mode.g .ic{background:#ffb54722}.mode.g{border-color:#ffb54733}
.mode.v .ic{background:#4fd1c522}.mode.v{border-color:#4fd1c533}
.mode.r .ic{background:#b388ff22}.mode.r{border-color:#b388ff33}
.mode.m .ic{background:#ff5c7a22}.mode.m{border-color:#ff5c7a33}
.mode.gv .ic{background:#7bd38922}.mode.gv{border-color:#7bd38955}
.mode.soon{opacity:.5}
.mode.dv .ic{background:#4fd1c522}.mode.dv{border-color:#4fd1c566;background:linear-gradient(135deg,#173f44,var(--card))}
.mode.dv.done{border-color:#3ddc8455;background:var(--card)}
.wcard{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.wcard .top1{display:flex;align-items:center;gap:8px}
.wcard .w{font-size:22px;font-weight:700}
.wcard .pos{font-size:12px;color:var(--muted);background:#0003;border-radius:8px;padding:2px 8px}
.wcard .say{margin-left:auto;background:#4fd1c533;width:38px;height:38px;border-radius:12px;font-size:18px}
.wcard .th{color:var(--v);font-size:16px;margin:4px 0 6px}
.wcard .exs{font-size:14px;color:#dcdaf7;line-height:1.5;font-style:italic}
.wcard .exs mark{background:none;color:var(--g);font-weight:700;font-style:normal}
.wcard.rvw{border-left:4px solid #ff7ac6}
.sec{margin:16px 4px 10px;font-weight:600;color:var(--muted)}
.mode.rv .ic{background:#ff7ac622}.mode.rv{border-color:#ff7ac666;background:linear-gradient(135deg,#4a2350,var(--card));margin-bottom:18px}
.mode.rv.done{border-color:#3ddc8455;background:var(--card)}
.pill{display:inline-block;background:var(--bad);color:#fff;font-weight:800;border-radius:99px;padding:4px 10px;font-size:14px}
.pill.ok{background:var(--ok);color:#06301a}
.weak{color:#ff9db8;font-size:11px;display:block}
.mode.ac .ic{background:#5b8cff22}.mode.ac{border-color:#5b8cff66;background:linear-gradient(135deg,#25305e,var(--card))}
.unit{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 10px}
.unit b{font-size:15px}
.ubtn{background:#5b8cff33;color:#cfe0ff;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600}
.les{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;text-align:left}
.les:active{transform:scale(.98)}
.les .ic{font-size:22px;width:40px;height:40px;border-radius:12px;background:#0003;display:grid;place-items:center;flex-shrink:0}
.les b{display:block;font-size:16px}.les small{color:var(--muted);font-size:12px}
.les .st{margin-left:auto;font-size:12px;text-align:right;white-space:nowrap;color:var(--muted)}
.lesson{background:var(--card);border-radius:20px;padding:16px 16px 6px;margin-bottom:110px;line-height:1.65;font-size:15px}
.lesson h4{font-size:17px;color:#9fbcff;margin:14px 0 6px}.lesson h4:first-child{margin-top:0}
.lesson p{margin-bottom:8px;color:#e4e2ff}
.lesson .eg{background:#0003;border-left:3px solid #5b8cff;border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-size:14.5px}
.lesson .eg b,.lesson p b{color:var(--g)}
.lesson .tip{background:#ffb5471a;border:1px solid #ffb54744;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px}
.lesson table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:13.5px}
.lesson th{background:#5b8cff33;text-align:left;padding:7px 8px}
.lesson td{padding:7px 8px;border-bottom:1px solid #ffffff14;vertical-align:top}
.lesson table.small{font-size:12px}.lesson table.small td,.lesson table.small th{padding:6px 4px;text-align:center}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 30%);z-index:4}
.dock .in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.dock button{flex:1;padding:14px 8px;border-radius:16px;font-size:16px;font-weight:700}
.dock .p{background:#5b8cff;color:#fff}.dock .e{background:var(--g);color:#2a1d00}
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lhead .t{font-size:20px;font-weight:700;line-height:1.2}.lhead small{color:var(--muted);font-size:13px;display:block;font-weight:400}
.ex{font-size:15px;color:#dcdaf7;line-height:1.6;margin-top:12px;background:#0003;border-radius:12px;padding:10px 12px;text-align:left;font-weight:400}
.ex mark{background:none;color:var(--accent);font-weight:700}
.biz{display:inline-block;font-size:11px;background:#ffb54733;color:var(--g);padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}

/* PLAY */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.x{background:var(--card);width:38px;height:38px;border-radius:12px;font-size:18px}
.prog{flex:1;height:10px;background:var(--card);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent,var(--g));transition:width .3s}
.hearts{font-size:18px;letter-spacing:1px}
.scorebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:600}
.score{font-size:22px}
.combo{background:linear-gradient(90deg,#ff7a59,var(--g));color:#241a00;padding:4px 12px;border-radius:99px;font-size:14px;font-weight:800;transform:scale(0);transition:transform .2s}
.combo.on{transform:scale(1)}
.combo.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.3)}}
.timer{height:6px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;width:100%;background:var(--ok)}
.qcard{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;min-height:110px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:#0003;color:var(--accent);margin-bottom:10px;letter-spacing:.5px}
.passage{background:#0003;border-radius:14px;padding:12px;font-size:14px;line-height:1.6;margin-bottom:12px;max-height:38vh;overflow:auto;color:#dcdaf7;white-space:pre-line}
.q{font-size:19px;font-weight:500;line-height:1.5}
.q .blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--accent);margin:0 3px}
.q.big{font-size:30px;font-weight:700;text-align:center;padding:10px 0}
.hint{font-size:13px;color:var(--muted);text-align:center}
.opts{display:grid;gap:10px}
.opt{background:var(--card2);border-radius:16px;padding:15px 16px;font-size:17px;text-align:left;border:2px solid transparent;display:flex;gap:12px;align-items:center;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt .k{width:28px;height:28px;border-radius:9px;background:#0003;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.opt.ok{background:#3ddc8433;border-color:var(--ok)}
.opt.bad{background:#ff5c7a33;border-color:var(--bad);animation:shake .35s}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);border-radius:24px 24px 0 0;transform:translateY(110%);transition:transform .25s;z-index:5}
.fb.show{transform:none}
.fb.good{background:#173f2e}.fb.wrong{background:#4a1a28}
.fb .in{max-width:480px;margin:0 auto}
.fb h4{font-size:20px;margin-bottom:4px}
.fb p{white-space:pre-line;font-size:14px;color:#e6e4ff;line-height:1.5;margin-bottom:12px}
.btn{width:100%;padding:15px;border-radius:16px;font-size:17px;font-weight:700;background:var(--g);color:#2a1d00}
.fb.good .btn{background:var(--ok);color:#06301a}
.fb.wrong .btn{background:var(--bad);color:#fff}
.float{position:fixed;font-weight:800;font-size:22px;color:var(--g);pointer-events:none;animation:up .9s forwards;z-index:9}
@keyframes up{to{transform:translateY(-60px);opacity:0}}

/* END */
.end{text-align:center;padding-top:10px}
.stars{font-size:46px;margin:6px 0;letter-spacing:6px}
.end h2{font-size:28px}
.big{font-size:52px;font-weight:800;color:var(--g);line-height:1.1}
.sub{color:var(--muted);margin-bottom:16px}
.grid3{display:flex;gap:8px;margin-bottom:16px}
.grid3 div{flex:1;background:var(--card);border-radius:14px;padding:10px}
.grid3 b{display:block;font-size:20px}
.grid3 small{color:var(--muted);font-size:12px}
.lvup{background:linear-gradient(90deg,#ff7a59,var(--g));color:#2a1d00;border-radius:14px;padding:10px;font-weight:700;margin-bottom:14px}
.review{text-align:left;margin:14px 0}
.rv{background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;font-size:14px;line-height:1.5}
.rv b{color:var(--ok)}
.rv small{white-space:pre-line;color:var(--muted);display:block;margin-top:4px}
.btn2{width:100%;padding:14px;border-radius:16px;font-size:16px;font-weight:600;background:var(--card);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

<!-- HOME -->
<section id="home">
  <div class="top">
    <div class="logo">TOEIC <span>Quest</span></div>
    <div class="streak" id="streak">🔥 0 วัน</div>
  </div>
  <div class="profile">
    <div class="lvrow">
      <div><div class="lv" id="lv">Lv.1</div><div class="rank" id="rank"></div></div>
      <div class="xptxt" id="xptxt"></div>
    </div>
    <div class="bar"><i id="xpbar" style="width:0"></i></div>
    <div class="stats">
      <div class="stat"><b id="sPlayed">0</b><small>รอบที่เล่น</small></div>
      <div class="stat"><b id="sAcc">0%</b><small>ความแม่นยำ</small></div>
      <div class="stat"><b id="sCombo">0</b><small>คอมโบสูงสุด</small></div>
    </div>
  </div>
  <button class="mode rv" id="openReview"><div class="ic">🔁</div><div><b>ทบทวนวันนี้</b><small id="rvSub">ข้อที่เคยผิด + บทที่ควรทวน</small></div><div class="best" id="rvBadge"></div></button>
  <button class="mode dv" id="openDaily"><div class="ic">📅</div><div><b>Daily Vocab</b><small id="dvSub">วันละ 10 คำ</small></div><div class="best" id="dvBadge"></div></button>
  <h3>เลือกโหมด</h3>
  <button class="mode ac" id="openAcademy"><div class="ic">📘</div><div><b>Grammar Academy</b><small>เรียน 18 บท · คลังข้อสอบกว่า 1 แสนข้อ</small></div><div class="best" id="b-academy"></div></button>
  <button class="mode g" data-mode="grammar"><div class="ic">⚡</div><div><b>Grammar Rush</b><small>สุ่มจากคลังรวม 11 หมื่นข้อ · 10 ข้อ · ข้อละ 20 วิ</small></div><div class="best" id="b-grammar"></div></button>
  <button class="mode v" data-mode="vocab"><div class="ic">🃏</div><div><b>Vocab Blitz</b><small>ศัพท์ TOEIC · 12 ข้อ · ข้อละ 10 วิ</small></div><div class="best" id="b-vocab"></div></button>
  <button class="mode r" data-mode="reading"><div class="ic">📄</div><div><b>Reading Mission</b><small>Part 7 · อ่าน 2 เรื่อง · ไม่จับเวลา</small></div><div class="best" id="b-reading"></div></button>
  <button class="mode m" data-mode="mix"><div class="ic">🎲</div><div><b>Quick Mix</b><small>Grammar + Vocab คละกัน · 15 ข้อ</small></div><div class="best" id="b-mix"></div></button>
  <button class="mode gv" id="openGames"><div class="ic">🎮</div><div><b>Game Vocab</b><small>เรียนศัพท์จากเกมที่ชอบ · 12 ข้อ · ข้อละ 15 วิ</small></div><div class="best">เลือกเกม ›</div></button>
</section>

<!-- GAME PICKER -->
<section id="games" class="hidden">
  <div class="hud"><button class="x" id="gBack">‹</button><div class="logo" style="font-size:20px">🎮 Game Vocab</div></div>
  <p class="sub" style="text-align:left;margin:4px 4px 14px">ศัพท์ที่เจอในเกม พร้อมประโยคตัวอย่างจากเนื้อเรื่อง คำที่มีป้าย 💼 ออกสอบ TOEIC ด้วย</p>
  <div id="gameList"></div>
</section>

<!-- ACADEMY -->
<section id="academy" class="hidden">
  <div class="hud"><button class="x" id="aBack">‹</button><div class="logo" style="font-size:20px">📘 Grammar Academy</div></div>
  <div class="profile" style="padding:14px;margin-bottom:6px">
    <div class="lvrow" style="margin-bottom:8px"><div style="font-weight:600">ความคืบหน้า</div><div class="xptxt" id="acTxt"></div></div>
    <div class="bar"><i id="acBar" style="width:0;background:linear-gradient(90deg,#5b8cff,#4fd1c5)"></i></div>
  </div>
  <div id="unitList"></div>
</section>

<!-- LESSON -->
<section id="lesson" class="hidden">
  <div class="lhead"><button class="x" id="lBack">‹</button><div class="t" id="lTitle"></div></div>
  <div class="lesson" id="lBody"></div>
  <div class="dock"><div class="in"><button class="p" id="lPractice">✏️ ฝึกทำ</button><button class="e" id="lExam">📝 สอบบทนี้</button></div></div>
</section>

<!-- DAILY VOCAB -->
<section id="daily" class="hidden">
  <div class="lhead"><button class="x" id="dBack">‹</button><div class="t" id="dTitle"></div></div>
  <div class="profile" style="padding:14px;margin-bottom:6px">
    <div class="lvrow" style="margin-bottom:8px"><div style="font-weight:600">300 คำ</div><div class="xptxt" id="dvTxt"></div></div>
    <div class="bar"><i id="dvBar" style="width:0;background:linear-gradient(90deg,#4fd1c5,#3ddc84)"></i></div>
  </div>
  <div id="dList" style="margin-bottom:110px"></div>
  <div class="dock"><div class="in"><button class="e" id="dStart" style="background:var(--v);color:#06302c">เริ่มทดสอบ</button></div></div>
</section>

<!-- PLAY -->
<section id="play" class="hidden">
  <div class="hud">
    <button class="x" id="quit">✕</button>
    <div class="prog"><i id="prog"></i></div>
    <div class="hearts" id="hearts"></div>
  </div>
  <div class="scorebar"><div class="score" id="score">0</div><div class="combo" id="combo">x2 COMBO</div></div>
  <div class="timer" id="timerWrap"><i id="timer"></i></div>
  <div class="qcard">
    <div class="tag" id="tag"></div>
    <div class="passage hidden" id="passage"></div>
    <div class="q" id="q"></div>
  </div>
  <div class="opts" id="opts"></div>
</section>

<!-- END -->
<section id="end" class="hidden end">
  <div class="stars" id="stars"></div>
  <h2 id="endTitle"></h2>
  <div class="big" id="endScore">0</div>
  <div class="sub" id="endSub"></div>
  <div class="lvup hidden" id="lvup"></div>
  <div class="grid3">
    <div><b id="eCorrect">0</b><small>ตอบถูก</small></div>
    <div><b id="eCombo">0</b><small>คอมโบสูงสุด</small></div>
    <div><b id="eXp">+0</b><small>XP</small></div>
  </div>
  <button class="btn" id="again">เล่นอีกครั้ง</button>
  <button class="btn2" id="home2">กลับหน้าหลัก</button>
  <div class="review" id="review"></div>
</section>
</div>

<div class="fb" id="fb"><div class="in"><h4 id="fbT"></h4><p id="fbP"></p><button class="btn" id="next">ต่อไป</button></div></div>

<script>
/* ===== DATA ===== */
const GRAMMAR = [
["The new policy will take effect ___ January 1.",["on","in","at","by"],0,"วันที่เฉพาะเจาะจงใช้ on (on January 1)"],
["All employees are required ___ their ID badges.",["wear","wearing","to wear","wore"],2,"be required to + V1 = ถูกกำหนดให้ต้องทำ"],
["The manager is looking forward to ___ the new team.",["meet","meeting","met","meets"],1,"look forward to + V-ing (to ตรงนี้เป็นบุพบท)"],
["Please submit your application ___ Friday at the latest.",["until","by","since","during"],1,"by = ภายใน (เส้นตาย) ส่วน until = ต่อเนื่องจนถึง"],
["Mr. Lee, ___ has worked here for ten years, will retire soon.",["who","which","whose","whom"],0,"แทนคนที่เป็นประธานของกริยา has worked ใช้ who"],
["The conference room is ___ larger than the one on the second floor.",["much","more","very","most"],0,"เน้นขั้นกว่าใช้ much/far/a lot + comparative (very ใช้ไม่ได้)"],
["If the shipment ___ late, we will contact the supplier.",["arrives","will arrive","arrived","arriving"],0,"If แบบที่ 1: If + Present Simple, will + V1"],
["The proposal was ___ reviewed by the committee.",["careful","carefully","care","caring"],1,"ขยายกริยา reviewed ต้องใช้ adverb"],
["Neither the manager nor the assistants ___ available today.",["is","are","be","being"],1,"neither…nor… กริยาผันตามคำนามที่อยู่ใกล้ (assistants → are)"],
["The company has been operating in Asia ___ 2015.",["for","since","from","at"],1,"since + จุดเวลาที่เริ่ม, for + ช่วงระยะเวลา"],
["___ the heavy rain, the event was held as scheduled.",["Although","Despite","Because","However"],1,"Despite + คำนาม/V-ing ส่วน Although + ประโยค"],
["The report must be ___ by the end of the day.",["complete","completing","completed","completes"],2,"Passive: must be + V3"],
["Ms. Park asked her assistant to ___ the meeting to Thursday.",["postpone","postponing","postponed","postpones"],0,"ask someone to + V1"],
["This is the ___ product we have ever launched.",["successful","more successful","most successful","success"],2,"the + ขั้นสุด ใช้คู่กับ have ever"],

c:`<h4>ประโยคพื้นฐาน</h4>
<p>ประโยคภาษาอังกฤษต้องมี <b>ประธาน (S)</b> และ <b>กริยา (V)</b> เสมอ แล้วอาจมี <b>กรรม (O)</b> หรือ <b>ส่วนเติมเต็ม (C)</b> ตามมา</p>
<div class="eg"><b>S + V</b> → The store / opens.<br><b>S + V + O</b> → The manager / signed / the contract.<br><b>S + V + C</b> → Ms. Lee / is / busy.<br><b>S + V + O + O</b> → She / sent / me / an email.</div>
<h4>กฎทอง: 1 ประโยค = กริยาแท้ 1 ตัว</h4>
<p>ถ้าอยากใส่สองใจความ ต้องมีคำเชื่อม (and, but, because…) ไม่อย่างนั้นจะผิด</p>
<div class="eg">❌ The report is ready, I sent it.<br>✅ The report is ready, <b>and</b> I sent it.</div>
<h4>ตำแหน่งของคำ</h4>
<table><tr><th>ชนิดคำ</th><th>อยู่ตรงไหน</th></tr>
<tr><td>Noun (นาม)</td><td>ประธาน, กรรม, หลัง a/the/my</td></tr>

c:`<h4>คำในตระกูลเดียวกันเปลี่ยนรูปตามหน้าที่</h4>
<div class="eg">decide (v.) → decision (n.) → decisive (adj.) → decisively (adv.)<br>succeed (v.) → success (n.) → successful (adj.) → successfully (adv.)</div>
<h4>สังเกตจากคำลงท้าย (Suffix)</h4>
<table><tr><th>ชนิด</th><th>คำลงท้าย</th></tr>
<tr><td>Noun</td><td>-tion, -ment, -ness, -ity, -ance/-ence<br>คน: -er, -or, -ant, -ist</td></tr>
<tr><td>Verb</td><td>-ize, -ify, -en, -ate</td></tr>
<tr><td>Adjective</td><td>-ful, -less, -ous, -ive, -able/-ible, -al, -ic</td></tr>
<tr><td>Adverb</td><td>adj + -ly (quick → quickly)</td></tr></table>
<h4>สูตรตำแหน่งที่เจอบ่อยใน TOEIC</h4>
<div class="eg">a / the / my + (adj) + <b>N</b> → a <b>successful</b> <b>launch</b><br>be + <b>adj</b> → The workshop was <b>informative</b>.<br>V + <b>adv</b> → Sales grew <b>rapidly</b>.<br><b>adv</b> + adj → <b>highly</b> skilled</div>
<div class="tip">💡 ระวัง: friendly, costly, lovely, timely ลงท้าย -ly แต่เป็น <b>adjective</b> ไม่ใช่ adverb</div>`,

noun:{e:"📦",t:"คำนาม: เอกพจน์ / พหูพจน์",s:"นับได้ นับไม่ได้ และคำบอกปริมาณ",
c:`<h4>การทำเป็นพหูพจน์</h4>
<table><tr><th>กฎ</th><th>ตัวอย่าง</th></tr>
<tr><td>ทั่วไป + s</td><td>book → books</td></tr>
<tr><td>s, sh, ch, x, o + es</td><td>box → boxes, watch → watches</td></tr>
<tr><td>พยัญชนะ + y → ies</td><td>company → companies</td></tr>
<tr><td>สระ + y → + s</td><td>day → days</td></tr>
<tr><td>f / fe → ves</td><td>shelf → shelves, knife → knives</td></tr></table>
<p><b>รูปพิเศษ:</b> man → men, woman → women, child → children, person → people, foot → feet, tooth → teeth<br><b>รูปเดิม:</b> sheep, fish, series</p>
<h4>คำนามนับไม่ได้ (ออกสอบบ่อยมาก)</h4>
<div class="eg">information, advice, equipment, furniture, luggage, feedback, research, money, news, machinery, merchandise</div>
<p>ไม่ใส่ a/an, ไม่เติม s และใช้กริยาเอกพจน์ ถ้าจะนับให้ใช้ <b>a piece of</b> advice หรือ <b>an item of</b> equipment</p>
<h4>คำบอกปริมาณ</h4>
<table><tr><th>นับได้ (พหูพจน์)</th><th>นับไม่ได้</th></tr>
<tr><td>many, few, a few, several, a number of</td><td>much, little, a little, an amount of</td></tr>
<tr><td colspan="2" style="text-align:center">ใช้ได้ทั้งคู่: some, any, a lot of, plenty of, most</td></tr></table>
<div class="tip">💡 a few / a little = มีอยู่บ้าง (เชิงบวก) · few / little = แทบไม่มี (เชิงลบ)</div>`,
q:[
["We received a lot of useful ___ from customers.",["feedback","feedbacks","a feedback","the feedbacks"],0,"feedback เป็นนามนับไม่ได้ ไม่เติม s"],
["There are three ___ in the new building.",["libraries","librarys","library","libraryes"],0,"พยัญชนะ + y → ies"],
["How ___ money do we have left in the budget?",["much","many","few","several"],0,"money นับไม่ได้ → much"],
["Several ___ attended the seminar.",["people","person","peoples","a person"],0,"several + นามพหูพจน์ → people (พหูพจน์ของ person)"],
["The office needs new ___.",["furniture","furnitures","a furniture","furniture pieces of"],0,"furniture นับไม่ได้"],
["Only a ___ employees know about the plan.",["few","little","much","less"],0,"employees นับได้ → a few"],
["The ___ of applicants has increased this year.",["number","amount","much","deal"],0,"applicants นับได้ → the number of"],
["All the ___ were sent to the Tokyo office.",["boxes","boxs","box","boxies"],0,"x + es → boxes"],
["Could you give me some ___ about the interview?",["advice","advices","an advice","advise"],0,"advice (n.) นับไม่ได้ ส่วน advise เป็นกริยา"]
]},
article:{e:"🅰️",t:"a / an / the",s:"คำนำหน้านาม",
c:`<h4>a / an ใช้กับนามนับได้เอกพจน์ที่ยังไม่เจาะจง</h4>
<p>ดูที่ <b>เสียง</b> ไม่ใช่ตัวอักษร</p>
<div class="eg"><b>a</b> + เสียงพยัญชนะ → a book, a <b>u</b>niversity (ยู), a <b>o</b>ne-way ticket<br><b>an</b> + เสียงสระ → an email, an <b>h</b>our (h ไม่ออกเสียง), an MBA</div>
<h4>the ใช้กับสิ่งที่เจาะจง</h4>
<div class="eg">• รู้กันอยู่แล้ว: Please close <b>the</b> door.<br>• มีหนึ่งเดียว: <b>the</b> sun, <b>the</b> internet<br>• ขั้นสุด/ลำดับ: <b>the</b> best, <b>the</b> first, <b>the</b> second floor<br>• ชื่อที่เป็นพหูพจน์หรือทะเล/แม่น้ำ: <b>the</b> Philippines, <b>the</b> Pacific</div>
<h4>ไม่ใส่ article</h4>
<div class="eg">• นามพหูพจน์ทั่วไป: Computers are useful.<br>• นามนับไม่ได้ทั่วไป: Information is important.<br>• ชื่อเมือง ประเทศ บริษัท: Bangkok, Japan, Samsung</div>
<div class="tip">💡 นามนับได้เอกพจน์ห้ามอยู่ลอย ๆ ต้องมี a/an/the/my/this อย่างใดอย่างหนึ่งนำหน้า</div>`,
q:[
["She works as ___ engineer.",["an","a","the","much"],0,"engineer ขึ้นต้นด้วยเสียงสระ → an"],
["It took ___ hour to finish the report.",["an","a","many","few"],0,"hour ไม่ออกเสียง h → an"],
["This is ___ best hotel in the city.",["the","a","an","much"],0,"ขั้นสุด (best) ใช้ the"],
["Mr. Ross graduated from ___ university in London.",["a","an","much","many"],0,"university ออกเสียง 'ยู' ซึ่งเป็นเสียงพยัญชนะ → a"],
["___ sun rises in the east.",["The","A","An","Some"],0,"สิ่งที่มีหนึ่งเดียว → the"],
["Ms. Diaz received ___ email from the client.",["an","a","much","many"],0,"email ขึ้นต้นด้วยเสียงสระ → an"],
["Please take the documents to ___ second floor.",["the","a","an","some"],0,"ลำดับที่ (second) ใช้ the"],
["___ information on the website is out of date.",["The","An","A","Many"],0,"information นับไม่ได้ ใส่ a/an ไม่ได้ ข้อมูลนี้เจาะจงจึงใช้ the"]
]},
pronoun:{e:"👤",t:"สรรพนาม",s:"I / me / my / mine / myself",
c:`<h4>ตารางสรรพนาม</h4>
<table class="small"><tr><th>ประธาน</th><th>กรรม</th><th>+ นาม</th><th>ยืนเดี่ยว</th><th>ตัวเอง</th></tr>
<tr><td>I</td><td>me</td><td>my</td><td>mine</td><td>myself</td></tr>
<tr><td>you</td><td>you</td><td>your</td><td>yours</td><td>yourself</td></tr>
<tr><td>he</td><td>him</td><td>his</td><td>his</td><td>himself</td></tr>
<tr><td>she</td><td>her</td><td>her</td><td>hers</td><td>herself</td></tr>
<tr><td>it</td><td>it</td><td>its</td><td>–</td><td>itself</td></tr>
<tr><td>we</td><td>us</td><td>our</td><td>ours</td><td>ourselves</td></tr>
<tr><td>they</td><td>them</td><td>their</td><td>theirs</td><td>themselves</td></tr></table>
<h4>วิธีเลือก</h4>
<div class="eg">• หน้ากริยา → <b>ประธาน</b>: <b>We</b> agreed.<br>• หลังกริยา/บุพบท → <b>กรรม</b>: Call <b>me</b>. / between you and <b>me</b><br>• หน้าคำนาม → <b>my/our…</b>: <b>our</b> new office<br>• ไม่มีคำนามตามหลัง → <b>mine/ours…</b>: This desk is <b>mine</b>.<br>• ทำกับตัวเอง หรือ by + -self (ด้วยตัวเอง): She did it <b>by herself</b>.</div>
<div class="tip">💡 <b>its</b> = ของมัน · <b>it's</b> = it is ข้อนี้ TOEIC ชอบหลอก</div>`,
q:[
["Please send the report to ___ by noon.",["me","I","my","mine"],0,"หลังบุพบท to ใช้รูปกรรม → me"],
["Ms. Wong prepared the slides by ___.",["herself","her","she","hers"],0,"by + -self = ด้วยตัวเอง"],
["The company announced ___ new logo.",["its","it's","it","their's"],0,"หน้าคำนาม logo ใช้ its (ของมัน)"],
["This desk is ___, not yours.",["mine","my","me","I"],0,"ไม่มีคำนามตามหลัง → mine"],
["Mr. and Mrs. Hill sold ___ house last year.",["their","them","they","theirs"],0,"หน้าคำนาม house → their"],
["___ will discuss the budget at the meeting.",["We","Us","Our","Ours"],0,"หน้ากริยาต้องเป็นประธาน → We"],
["Between you and ___, the plan is not ready.",["me","I","my","myself"],0,"หลังบุพบท between ใช้รูปกรรม → me"],
["The employees introduced ___ to the new manager.",["themselves","them","their","theirs"],0,"ประธานกับกรรมเป็นคนกลุ่มเดียวกัน → themselves"]
]},
present:{e:"⏱️",t:"Present Simple & Continuous",s:"ปัจจุบันธรรมดา / กำลังทำ",
c:`<h4>Present Simple: S + V1 (he/she/it + s/es)</h4>
<p>ใช้กับความจริง นิสัย สิ่งที่ทำเป็นประจำ และตารางเวลา</p>
<div class="eg">Ms. Lim usually <b>takes</b> the train.<br>The store <b>opens</b> at 9 a.m.<br>Water <b>boils</b> at 100°C.<br>ปฏิเสธ: He <b>does not</b> work on Sundays.</div>
<p><b>คำบอกเวลา:</b> always, usually, often, sometimes, every day, on Mondays</p>
<h4>Present Continuous: am/is/are + V-ing</h4>
<p>ใช้กับสิ่งที่กำลังทำอยู่ตอนนี้ เรื่องชั่วคราวช่วงนี้ หรือแผนอนาคตที่นัดไว้แล้ว</p>
<div class="eg">The director <b>is taking</b> a call right now.<br>We <b>are hiring</b> new staff this month.<br>I <b>am meeting</b> the client tomorrow.</div>
<p><b>คำบอกเวลา:</b> now, right now, at the moment, currently, this week</p>
<div class="tip">💡 กริยาบอกสภาพไม่ใช้ -ing เช่น know, believe, need, want, belong, own, prefer, understand<br>❌ I am knowing → ✅ I know</div>`,
q:[
["Ms. Lim usually ___ to work by train.",["goes","go","is going","going"],0,"usually = ทำเป็นประจำ ใช้ Present Simple และประธานเอกพจน์ → goes"],
["Please be quiet. The director ___ a call right now.",["is taking","takes","take","taken"],0,"right now = กำลังทำ → is taking"],
["The store ___ at 9 a.m. every day.",["opens","is opening","open","opening"],0,"ตารางเวลาประจำ → opens"],
["We are currently ___ a new office manager.",["seeking","seek","sought","seeks"],0,"are + V-ing (Present Continuous)"],
["This laptop ___ to the IT department.",["belongs","is belonging","belong","belonging"],0,"belong เป็นกริยาบอกสภาพ ไม่ใช้ -ing"],
["Mr. Garcia ___ not work on weekends.",["does","do","is","has"],0,"ประธานเอกพจน์ ปฏิเสธด้วย does not + V1"],
["The team ___ on the report at the moment.",["is working","works","work","worked"],0,"at the moment = กำลังทำ"],
["Water ___ at 100 degrees Celsius.",["boils","is boiling","boil","boiled"],0,"ความจริงทางธรรมชาติ → Present Simple"]
]},
past:{e:"⏪",t:"Past Simple & Continuous",s:"อดีตธรรมดา / กำลังทำในอดีต",
c:`<h4>Past Simple: S + V2</h4>
<p>ใช้กับเหตุการณ์ที่เกิดและจบไปแล้วในอดีต</p>
<div class="eg">We <b>launched</b> the product last month.<br>กริยาไม่ปกติ: go → <b>went</b>, buy → <b>bought</b>, send → <b>sent</b>, meet → <b>met</b>, rise → <b>rose</b><br>ปฏิเสธ/คำถาม: did not + V1 / <b>Did</b> you call him?</div>
<p><b>คำบอกเวลา:</b> yesterday, last week, two days ago, in 2020</p>
<h4>Past Continuous: was/were + V-ing</h4>
<p>ใช้กับสิ่งที่กำลังทำอยู่ ณ จุดหนึ่งในอดีต มักคู่กับเหตุการณ์ที่แทรกเข้ามา</p>
<div class="eg">I <b>was writing</b> a report <b>when</b> the power <b>went</b> out.<br><b>While</b> she <b>was having</b> lunch, her phone <b>rang</b>.</div>
<div class="tip">💡 เหตุการณ์ยาวที่กำลังทำใช้ was/were + V-ing ส่วนเหตุการณ์สั้นที่แทรกเข้ามาใช้ V2</div>`,
q:[
["The company ___ its new product last month.",["launched","launches","has launched","launching"],0,"last month → Past Simple"],
["We ___ the client two days ago.",["met","meet","have met","meeting"],0,"ago → Past Simple (meet → met)"],
["I ___ a report when the power went out.",["was writing","wrote","am writing","write"],0,"เหตุการณ์ที่กำลังทำแล้วมีอะไรแทรก → was writing"],
["Mr. Kim did not ___ the meeting yesterday.",["attend","attended","attends","attending"],0,"did not + V1"],
["While she ___ lunch, her phone rang.",["was having","has","have","is having"],0,"while + Past Continuous"],
["They ___ the office in 2019.",["opened","have opened","open","opening"],0,"in 2019 (ปีในอดีต) → Past Simple"],
["Last year, sales ___ by 15 percent.",["rose","rise","risen","rising"],0,"rise → rose (V2)"],
["What ___ you doing at 8 p.m. last night?",["were","did","was","are"],0,"you + were + V-ing (Past Continuous)"]
]},
perfect:{e:"✅",t:"Perfect Tenses",s:"has/have + V3 · had + V3",
c:`<h4>Present Perfect: has/have + V3</h4>
<p>ใช้กับเรื่องที่เริ่มในอดีตแล้วต่อเนื่องถึงตอนนี้ ประสบการณ์ หรือสิ่งที่เพิ่งเสร็จ</p>
<div class="eg">She <b>has worked</b> here <b>since</b> 2018.<br>We <b>have already paid</b> the invoice.<br><b>Have</b> you <b>ever been</b> to Japan?</div>
<p><b>คำบอกเวลา:</b> since, for, already, yet, just, ever, never, recently, so far</p>
<div class="tip">💡 ห้ามใช้ Present Perfect กับเวลาที่จบไปแล้ว เช่น yesterday, ago, last year → ต้องใช้ Past Simple</div>
<h4>Present Perfect Continuous: has/have been + V-ing</h4>
<div class="eg">They <b>have been waiting</b> for an hour. (เน้นว่ารอต่อเนื่องมานาน)</div>
<h4>Past Perfect: had + V3</h4>
<p>ใช้กับเหตุการณ์ที่เกิดก่อนอีกเหตุการณ์หนึ่งในอดีต</p>
<div class="eg"><b>By the time</b> we arrived, the meeting <b>had started</b>.<br>She <b>had finished</b> the report <b>before</b> the manager asked.</div>`,
q:[
["Ms. Tan ___ here since 2018.",["has worked","works","worked","is working"],0,"since + จุดเริ่มต้น → Present Perfect"],
["We have already ___ the invoice.",["paid","pay","paying","pays"],0,"have + V3 (pay → paid)"],
["Have you ___ been to the Singapore branch?",["ever","yet","since","ago"],0,"Have you ever…? = เคย…ไหม"],
["By the time we arrived, the meeting ___.",["had started","has started","starts","will start"],0,"เกิดก่อนอีกเหตุการณ์ในอดีต → Past Perfect"],
["The company ___ three new stores so far this year.",["has opened","opens","had opened","opening"],0,"so far = จนถึงตอนนี้ → Present Perfect"],
["I haven't received the package ___.",["yet","already","ever","since"],0,"ประโยคปฏิเสธใช้ yet ไว้ท้ายประโยค"],
["They ___ been waiting for an hour.",["have","has","are","had been"],0,"They + have been + V-ing"],
["She ___ the report before her manager asked for it.",["had finished","has finished","finishes","will finish"],0,"เสร็จก่อนเหตุการณ์ในอดีต (asked) → had finished"]
]},
future:{e:"⏩",t:"Future Tenses",s:"will / be going to / will have V3",
c:`<h4>will + V1</h4>
<p>ใช้กับการตัดสินใจตอนพูด การคาดการณ์ คำสัญญา และแผนทางการ</p>
<div class="eg">I<b>'ll help</b> you with the boxes.<br>The policy <b>will take</b> effect next month.</div>
<h4>be going to + V1</h4>
<p>ใช้กับแผนที่ตั้งใจไว้แล้ว หรือสิ่งที่มีหลักฐานให้เห็นว่าจะเกิด</p>
<div class="eg">We <b>are going to</b> open a new branch.<br>Look at the clouds. It<b>'s going to</b> rain.</div>
<h4>Future Continuous / Future Perfect</h4>
<div class="eg">This time tomorrow, I <b>will be flying</b> to Bangkok. (กำลังทำ ณ เวลาหนึ่งในอนาคต)<br><b>By</b> next June, we <b>will have completed</b> the project. (จะเสร็จก่อนเวลาหนึ่งในอนาคต)</div>
<div class="tip">💡 หลัง when, as soon as, before, after, until, if <b>ห้ามใช้ will</b> ให้ใช้ Present Simple แทน<br>✅ I'll call you <b>as soon as</b> I <b>get</b> the results.</div>`,
q:[
["The new policy ___ effect next month.",["will take","took","has taken","taking"],0,"next month → อนาคต"],
["Look at those clouds. It ___ rain.",["is going to","was going to","has","did"],0,"มีหลักฐานให้เห็น → be going to"],
["By next June, we ___ the project.",["will have completed","completed","have completed","complete"],0,"by + เวลาในอนาคต → Future Perfect"],
["I will call you as soon as I ___ the results.",["get","will get","got","getting"],0,"หลัง as soon as ใช้ Present Simple แทน will"],
["This time tomorrow, I ___ to Bangkok.",["will be flying","fly","flew","have flown"],0,"กำลังทำ ณ เวลาหนึ่งในอนาคต → will be + V-ing"],
["Don't worry. I ___ help you with the boxes.",["will","am","have","did"],0,"ตัดสินใจตอนพูด → will"],
["Please wait here until the manager ___.",["arrives","will arrive","arrived","arriving"],0,"หลัง until ใช้ Present Simple"],
["The conference ___ in Seoul next year.",["will be held","held","is holding","holds"],0,"งานถูกจัด (passive) ในอนาคต → will be held"]
]},
agreement:{e:"🤝",t:"Subject–Verb Agreement",s:"ประธานกับกริยาต้องสอดคล้องกัน",
c:`<h4>หลักการ</h4>
<p>ประธานเอกพจน์ใช้กริยาเอกพจน์ (is, has, works) ประธานพหูพจน์ใช้กริยาพหูพจน์ (are, have, work)</p>
<h4>จุดที่ TOEIC ชอบหลอก</h4>
<table><tr><th>รูปแบบ</th><th>กริยา</th></tr>
<tr><td>each / every / everyone + N</td><td>เอกพจน์</td></tr>
<tr><td>one of the + N พหูพจน์</td><td>เอกพจน์</td></tr>
<tr><td>the number of + N</td><td>เอกพจน์</td></tr>
<tr><td>a number of + N</td><td>พหูพจน์</td></tr>
<tr><td>นามนับไม่ได้ (equipment, information)</td><td>เอกพจน์</td></tr>
<tr><td>A and B</td><td>พหูพจน์</td></tr>
<tr><td>either/neither A or/nor B</td><td>ตาม B (ตัวที่อยู่ใกล้กริยา)</td></tr></table>
<h4>ประธานยาวมีคำมาคั่น</h4>
<div class="eg">The <b>list</b> of participants <b>is</b> online. (ดูที่ list ไม่ใช่ participants)<br>There <b>are</b> several options. (กริยาผันตามนามที่อยู่หลัง there)</div>
<div class="tip">💡 เจอ of, with หรือ in หลังประธาน ให้ตัดวลีนั้นทิ้งไปก่อน แล้วดูว่าประธานจริงคือคำไหน</div>`,
q:[
["Every employee ___ a parking card.",["has","have","are having","were"],0,"every + เอกพจน์ → has"],
["One of the printers ___ not working.",["is","are","were","be"],0,"one of … → ประธานคือ one (เอกพจน์)"],
["A number of customers ___ complained.",["have","has","is","was"],0,"a number of = หลาย → พหูพจน์"],
["The list of participants ___ on the website.",["is","are","were","be"],0,"ประธานจริงคือ the list (เอกพจน์)"],
["There ___ several options for the event.",["are","is","was","has"],0,"กริยาผันตาม options (พหูพจน์)"],
["Either the manager or the assistants ___ the keys.",["have","has","is having","was"],0,"either…or… ผันตามตัวที่ใกล้ (assistants)"],
["The equipment ___ checked every month.",["is","are","were","have"],0,"equipment นับไม่ได้ → เอกพจน์"],
["Mr. Ford and his team ___ in Osaka now.",["are","is","was","has"],0,"A and B → พหูพจน์"]
]},
passive:{e:"🔄",t:"Passive Voice",s:"ประโยคถูกกระทำ: be + V3",
c:`<h4>เมื่อไหร่ใช้ Passive</h4>
<p>ใช้เมื่อต้องการเน้นสิ่งที่ถูกกระทำ หรือไม่รู้/ไม่สำคัญว่าใครเป็นคนทำ</p>
<div class="eg">Active: The factory <b>makes</b> the products.<br>Passive: The products <b>are made</b> (by the factory).</div>
<h4>สูตร: be + V3 (ผัน be ตาม tense)</h4>
<table><tr><th>Tense</th><th>Passive</th></tr>
<tr><td>Present</td><td>is / are made</td></tr>
<tr><td>Past</td><td>was / were made</td></tr>
<tr><td>Perfect</td><td>has / have been made</td></tr>
<tr><td>Continuous</td><td>is being made</td></tr>
<tr><td>Future</td><td>will be made</td></tr>
<tr><td>Modal</td><td>must / can / should be made</td></tr></table>
<div class="tip">💡 ถ้าประธานเป็นสิ่งของที่ทำเองไม่ได้ (report, order, product) และหลังช่องว่างไม่มีกรรม มักจะเป็น Passive<br>สำนวนที่เจอบ่อย: be required to, be expected to, be located in</div>`,
q:[

gerund:{e:"🎯",t:"Gerund & Infinitive",s:"V-ing หรือ to + V1",
c:`<h4>กริยาที่ตามด้วย V-ing</h4>

<div class="eg">want, plan, decide, hope, agree, offer, refuse, expect, need, afford, promise, aim</div>
<h4>V-ing หลังบุพบท (สำคัญมาก)</h4>
<div class="eg">Thank you <b>for</b> complet<b>ing</b>…<br>look forward <b>to</b> hear<b>ing</b> · be used <b>to</b> work<b>ing</b> · <b>before</b> leav<b>ing</b></div>
<h4>ความหมายเปลี่ยน</h4>
<div class="eg"><b>remember to lock</b> = อย่าลืมล็อก (ยังไม่ได้ทำ)<br><b>remember locking</b> = จำได้ว่าล็อกไปแล้ว<br><b>stop to smoke</b> = หยุดเพื่อสูบ · <b>stop smoking</b> = เลิกสูบ</div>
<div class="tip">💡 in order to / so as to + V1 = เพื่อที่จะ<br>be able to, be happy to, be likely to + V1</div>`,

conj:{e:"🔗",t:"คำเชื่อม",s:"Conjunction vs Preposition vs Transition",
c:`<h4>ดูว่าหลังช่องว่างเป็นอะไร</h4>

relative:{e:"🪢",t:"Relative Clauses",s:"who / which / that / whose / where",

question:{e:"❓",t:"ประโยคคำถาม",s:"Yes/No, Wh-, Tag, Indirect",
c:`<h4>Yes/No Question: Aux + S + V?</h4>
<div class="eg"><b>Do</b> you work here? · <b>Did</b> she call? · <b>Is</b> he ready? · <b>Have</b> they left? · <b>Can</b> you help?</div>
<h4>Wh- Question: Wh + Aux + S + V?</h4>
<div class="eg"><b>Where do</b> you work? · <b>When is</b> the meeting? · <b>How long have</b> you been here?<br>How much (นับไม่ได้/ราคา) · How many (นับได้) · How often (บ่อยแค่ไหน)</div>
<p><b>ถามประธาน</b> ไม่ต้องใช้ do: <b>Who called</b> you? · <b>What happened</b>?</p>
<h4>Tag Question</h4>
<div class="eg">บอกเล่า → tag ปฏิเสธ: You work in sales, <b>don't you</b>?<br>ปฏิเสธ → tag บอกเล่า: She hasn't arrived, <b>has she</b>?</div>
<h4>Indirect Question (ถามอ้อมแบบสุภาพ)</h4>
<p>หลัง Could you tell me / Do you know ให้เรียงแบบประโยคบอกเล่า (S + V) และไม่ใช้ do</p>
<div class="eg">Where is the station? → Could you tell me where <b>the station is</b>?<br>When does it leave? → Do you know when <b>it leaves</b>?</div>
<div class="tip">💡 ประโยคคำถามช่วยใน TOEIC Listening Part 2 ด้วย ฟังคำ Wh- ตัวแรกให้ชัด แล้วจะเลือกคำตอบได้ถูก</div>`,

/* ===== QUESTION GENERATORS ===== */
const R=a=>a[Math.random()*a.length|0];
function mk(q,ans,dis,ex){
  const seen=new Set([ans]);const d=[];
  for(const x of dis){if(x&&!seen.has(x)){seen.add(x);d.push(x)}if(d.length===3)break}
  if(d.length<3)return null;
  return [q,[ans,...d],0,ex];
}
const cap=s=>s[0].toUpperCase()+s.slice(1);
// subjects: [text, number(s/p/i), pronoun for tags]
const SUBJ=[["Ms. Tan","s","she"],["Mr. Kim","s","he"],["Our manager","s",null],["The new assistant","s",null],["The CEO","s",null],
 ["Ms. Lopez","s","she"],["Mr. Ito","s","he"],["My colleague","s",null],["The director","s",null],
 ["The engineers","p","they"],["Our clients","p","they"],["The interns","p","they"],["We","p","we"],["They","p","they"],
 ["The sales representatives","p","they"],["I","i","I"],["You","p","you"]];
const S1=()=>{const s=R(SUBJ);return{t:s[0],n:s[1],pr:s[2]}};
const V=(b,s3,p,pp,ing,o)=>({b,s3,p,pp,ing,o});
const VERBS=[

V("sign","signs","signed","signed","signing",["the agreement","the contract","the documents"]),

V("lead","leads","led","led","leading",["the meeting","the team","the workshop"]),
V("pay","pays","paid","paid","paying",["the bill","the invoice","the fee"]),
V("sell","sells","sold","sold","selling",["the old equipment","more products","the property"]),
V("read","reads","read","read","reading",["the manual","the contract","the instructions"]),
V("find","finds","found","found","finding",["a solution","the missing file","a new office"]),

const VO=()=>{const v=R(VERBS);return{v,o:R(v.o)}};
const low=t=>/^(We|They|You|The|Our|My)\b/.test(t)?t[0].toLowerCase()+t.slice(1):t;
const pres=(v,S)=>S.n==="s"?v.s3:v.b;
const be=S=>S.n==="s"?"is":S.n==="i"?"am":"are";
const beW=S=>S.n==="p"?"were":"was";

/* sample one generated question for a lesson (retry if a template can't build) */
function genQ(id){for(let i=0;i<20;i++){const q=GEN[id]();if(q&&q[1].every(x=>typeof x==="string"&&x.length))return q;}return null}

/* pick n unique questions for a lesson: some handwritten + rest generated */
function lessonSet(id,n,nHand){
  const out=[],seen=new Set();
  shuffleA(LESSONS[id].q).slice(0,nHand).forEach(q=>{seen.add(q[0]);out.push(q)});
  let guard=0;
  while(out.length<n&&guard++<200){const q=genQ(id);if(q&&!seen.has(q[0])){seen.add(q[0]);out.push(q)}}
  return shuffleA(out);
}

const XP_PER_LV=250;

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function show(id){["home","games","academy","lesson","daily","play","end"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0)}
const dayStr=(off=0)=>{const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const today=()=>dayStr(0);
const daysSince=s=>s?Math.round((new Date(today())-new Date(s))/864e5):999;

document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.mode));

/* ===== BUILD QUESTIONS ===== */
function gQ(item){
  const [s,o,a,ex]=item;const opts=o.map((t,i)=>({t,ok:i===a}));
  return {tag:"PART 5 · GRAMMAR",html:esc(s).replace("___","<span class='blank'></span>"),opts:shuffle(opts),ex,ans:o[a],plain:s.replace("___","["+o[a]+"]")};
}
function vQ(item){
  const [w,th]=item;const en2th=Math.random()<.6;
  const others=shuffle(VOCAB.filter(v=>v[0]!==w)).slice(0,3);
  if(en2th){
    return {tag:"VOCAB · แปลเป็นไทย",big:true,html:esc(w),hint:"คำนี้แปลว่าอะไร?",
      opts:shuffle([{t:th,ok:true},...others.map(v=>({t:v[1],ok:false}))]),ex:w+" = "+th,ans:th,plain:w};
  }
  return {tag:"VOCAB · เลือกคำศัพท์",big:true,html:esc(th),hint:"ภาษาอังกฤษคือคำไหน?",
    opts:shuffle([{t:w,ok:true},...others.map(v=>({t:v[0],ok:false}))]),ex:th+" = "+w,ans:w,plain:th};
}
function gameQ(item,pool){
  const [w,th,s,biz]=item;const b=biz?"<span class='biz'>💼 TOEIC</span>":"";
  const re=new RegExp("\\b("+w+"\\w*)","i");
  const others=shuffle(pool.filter(v=>v[0]!==w)).slice(0,3);
  const ex=w+" = "+th+(biz?" · 💼 คำนี้ออกสอบ TOEIC ด้วย":"")+"\n"+s;
  if(Math.random()<.5){
    return {tag:"GAME VOCAB · แปลเป็นไทย",big:true,html:esc(w)+b+"<div class='ex'>"+esc(s).replace(re,"<mark>$1</mark>")+"</div>",
      opts:shuffle([{t:th,ok:true},...others.map(v=>({t:v[1],ok:false}))]),ex,ans:th,plain:s};
  }
  return {tag:"GAME VOCAB · เติมคำ",html:esc(s).replace(re,"<span class='blank'></span>")+"<div class='hint' style='margin-top:10px'>ใบ้: "+esc(th)+"</div>",
    opts:shuffle([{t:w,ok:true},...others.map(v=>({t:v[0],ok:false}))]),ex,ans:w,plain:s};
}
function build(mode,game){
  if(mode==="game"){const pool=GAMES[game].words;return shuffle(pool).slice(0,12).map(i=>gameQ(i,pool));}
  const tagL=(qs,t,id)=>qs.map(x=>{const o=gQ(x);o.tag=t;o.src=id;return o});
  if(mode==="review")return buildReview();
  if(mode==="daily")return buildDaily();
  if(mode==="practice"){const l=LESSONS[game];return tagL(lessonSet(game,6,2),"✏️ ฝึก · "+l.t,game);}
  if(mode==="lexam"){const l=LESSONS[game];return tagL(lessonSet(game,10,3),"📝 สอบ · "+l.t,game);}
  if(mode==="uexam"){const u=UNITS.find(x=>x.id===game);return shuffle(u.lessons.flatMap(id=>tagL(lessonSet(id,3,1),"📝 "+u.name.split(" · ")[0]+" · "+LESSONS[id].t,id))).slice(0,12);}
  if(mode==="grammar"){const ids=Object.keys(LESSONS);const g=[];const seen=new Set();while(g.length<7){const id=R(ids),q=genQ(id);if(q&&!seen.has(q[0])){seen.add(q[0]);const o=gQ(q);o.src=id;g.push(o)}}return shuffle([...shuffle(GRAMMAR).slice(0,3).map(gQ),...g]);}
  if(mode==="vocab")return shuffle(VOCAB).slice(0,12).map(vQ);
  if(mode==="mix")return shuffle([...shuffle(GRAMMAR).slice(0,8).map(gQ),...shuffle(VOCAB).slice(0,7).map(vQ)]);
  const out=[];
  shuffle(READING).slice(0,2).forEach(r=>r.qs.forEach(([q,o])=>{
    out.push({tag:"PART 7 · "+r.t,passage:r.p,html:esc(q),opts:shuffle(o.map((t,i)=>({t,ok:i===0}))),ex:"คำตอบอยู่ในเนื้อเรื่อง ลองหาคำสำคัญจากคำถามแล้วอ่านรอบ ๆ ตรงนั้น",ans:o[0],plain:q});
  }));
  return out;
}

/* ===== REVIEW (spaced repetition) ===== */
const SRS_INT=[1,3,7,14,30]; // days until next review for box 0..4
const qKey=q=>(q.plain||q.html)+"|"+q.ans;
function track(q,ok){
  if(q.src&&LESSONS[q.src]){const s=save.ls[q.src]||(save.ls[q.src]={n:0,c:0,last:""});s.n++;if(ok)s.c++;s.last=today();
    if(s.n>40){s.n=Math.round(s.n/2);s.c=Math.round(s.c/2);}} // keep accuracy recent-ish
  const k=qKey(q),item=save.srs[k];
  if(!ok){
    const copy=Object.assign({},q);delete copy.passage;if(q.passage)copy.passage=q.passage;
    save.srs[k]={q:copy,box:0,due:dayStr(1),src:q.src||""};
    const keys=Object.keys(save.srs);if(keys.length>400){keys.sort((a,b)=>save.srs[a].due<save.srs[b].due?1:-1);delete save.srs[keys[0]];}
  }else if(item&&G.mode==="review"){
    item.box++;if(item.box>=SRS_INT.length)delete save.srs[k];else item.due=dayStr(SRS_INT[item.box]);
  }
  persist();
}
const dueItems=()=>Object.entries(save.srs).filter(([k,v])=>v.due<=today()).sort((a,b)=>a[1].due<b[1].due?-1:1);
function isWeak(id){const s=save.ls[id];if(!s||!s.n)return false;return s.c/s.n<.7||daysSince(s.last)>=7;}
function lessonWeight(id){const s=save.ls[id];if(!s||!s.n)return save.read[id]?.6:0;const acc=s.c/s.n;return (1-acc)*2+Math.min(daysSince(s.last),14)*.1+.2;}
function buildReview(){
  const out=[],seen=new Set();
  dueItems().slice(0,8).forEach(([k,v])=>{const q=Object.assign({},v.q);q.opts=shuffle(q.opts);q.tag="🔁 ข้อที่เคยผิด"+(v.box?" · รอบ "+(v.box+1):"");seen.add(k);out.push(q)});
  const ids=Object.keys(LESSONS).filter(id=>lessonWeight(id)>0);
  let guard=0;
  while(out.length<12&&guard++<300){
    let id;
    if(ids.length){let tot=ids.reduce((a,i)=>a+lessonWeight(i),0),r=Math.random()*tot;id=ids.find(i=>(r-=lessonWeight(i))<=0)||ids[0];}
    else id=R(Object.keys(LESSONS));
    const raw=Math.random()<.25?R(LESSONS[id].q):genQ(id);if(!raw)continue;
    const q=gQ(raw);q.src=id;q.tag="🔁 ทวน · "+LESSONS[id].t;const k=qKey(q);
    if(seen.has(k))continue;seen.add(k);out.push(q);
  }
  return shuffle(out);
}
function renderReviewCard(){
  const due=dueItems().length,done=save.lastReview===today();
  const weak=Object.keys(LESSONS).filter(isWeak).map(i=>LESSONS[i].t);
  $("openReview").classList.toggle("done",done);
  $("rvBadge").innerHTML=done?"<span class='pill ok'>✓</span>":due?"<span class='pill'>"+due+"</span>":"";
  $("rvSub").textContent=done?"ทบทวนวันนี้แล้ว 🎉 เล่นซ้ำได้อีก":
    (due?"ข้อที่เคยผิดถึงรอบทวน "+due+" ข้อ":"ยังไม่มีข้อที่ต้องทวน")+(weak.length?" · ควรทวน: "+weak.slice(0,2).join(", ")+(weak.length>2?" ฯลฯ":""):"")+" · 12 ข้อ";
}
$("openReview").onclick=()=>start("review");

/* ===== DAILY VOCAB ===== */
const DW={};DWORDS.forEach(d=>DW[d.w]=d);
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function dailyPlan(){
  if(save.dv.date!==today()){
    const newW=DWORDS.filter(d=>!save.vw[d.w]).slice(0,10).map(d=>d.w);
    const revW=Object.keys(save.vw).filter(w=>DW[w]&&save.vw[w].box<5&&save.vw[w].due<=today()).sort((a,b)=>save.vw[a].due<save.vw[b].due?-1:1).slice(0,20);
    save.dv={date:today(),newW,revW,done:false,day:(save.dv.day||0)+1};persist();
  }
  return save.dv;
}
const hlWord=(ex,w)=>esc(ex).replace(new RegExp("\\b("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")\\b","i"),"<mark>$1</mark>");
function wordCard(d,rv){
  return "<div class='wcard"+(rv?" rvw":"")+"'><div class='top1'><span class='w'>"+esc(d.w)+"</span><span class='pos'>"+d.pos+"</span><button class='say' data-w=\""+esc(d.w)+"\">🔊</button></div>"+
    "<div class='th'>"+esc(d.th)+"</div><div class='exs'>"+hlWord(d.ex,d.w)+"</div></div>";
}
function dvStats(){const v=Object.values(save.vw);return{seen:v.length,known:v.filter(x=>x.box>=2).length,master:v.filter(x=>x.box>=5).length}}
function openDaily(){
  const p=dailyPlan(),st=dvStats();
  const themes=[...new Set(p.newW.map(w=>DW[w].theme))];
  $("dTitle").innerHTML="📅 Daily Vocab · วันที่ "+p.day+"<small>"+(themes.length?"ธีมวันนี้: "+esc(themes.join(" + ")):"เรียนครบ 300 คำแล้ว · ทวนอย่างเดียว")+"</small>";
  $("dvTxt").textContent="เรียนแล้ว "+st.seen+" · จำได้ "+st.known+" · แม่นถาวร "+st.master;
  $("dvBar").style.width=(st.known/DWORDS.length*100)+"%";
  let html="";
  if(p.revW.length)html+="<div class='sec'>🔁 คำที่ต้องทวน ("+p.revW.length+" คำ)</div>"+p.revW.map(w=>wordCard(DW[w],1)).join("");
  if(p.newW.length)html+="<div class='sec'>🆕 คำใหม่วันนี้ ("+p.newW.length+" คำ) · แตะ 🔊 เพื่อฟังเสียง</div>"+p.newW.map(w=>wordCard(DW[w],0)).join("");
  if(!html)html="<div class='sec'>เรียนครบทุกคำแล้วและไม่มีคำที่ต้องทวนวันนี้ 🎉</div>";
  $("dList").innerHTML=html;
  $("dList").querySelectorAll(".say").forEach(b=>b.onclick=()=>say(b.dataset.w));
  const n=p.revW.length+p.newW.length;
  $("dStart").textContent=n?(p.done?"ทดสอบซ้ำ ("+n+" ข้อ)":"เริ่มทดสอบ ("+n+" ข้อ)"):"ไม่มีคำให้ทดสอบวันนี้";
  $("dStart").disabled=!n;
  show("daily");
}
function dailyQ(w,isRev){
  const d=DW[w];const same=DWORDS.filter(x=>x.w!==w&&x.pos===d.pos);const pool=same.length>=3?same:DWORDS.filter(x=>x.w!==w);
  const others=shuffle(pool).slice(0,3);
  const re=new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
  const types=["en","th"];if(re.test(d.ex))types.push("blank","blank");
  const t=R(types);const tag=(isRev?"🔁 ทวน":"📅 คำใหม่")+" · "+d.theme;
  const ex=d.w+" ("+d.pos+") = "+d.th+"\n"+d.ex;
  let q;
  if(t==="en")q={tag,big:true,html:esc(d.w)+"<div class='hint'>"+d.pos+" · แปลว่าอะไร?</div>",opts:shuffle([{t:d.th,ok:true},...others.map(o=>({t:o.th,ok:false}))]),ans:d.th};
  else if(t==="th")q={tag,big:true,html:esc(d.th)+"<div class='hint'>"+d.pos+" · ภาษาอังกฤษคือคำไหน?</div>",opts:shuffle([{t:d.w,ok:true},...others.map(o=>({t:o.w,ok:false}))]),ans:d.w};
  else q={tag,html:esc(d.ex).replace(re,"<span class='blank'></span>")+"<div class='hint' style='margin-top:10px'>ใบ้: "+esc(d.th)+"</div>",opts:shuffle([{t:d.w,ok:true},...others.map(o=>({t:o.w,ok:false}))]),ans:d.w};
  q.ex=ex;q.plain=d.w;q.word=w;return q;
}
function buildDaily(){const p=dailyPlan();return shuffle([...p.revW.map(w=>dailyQ(w,1)),...p.newW.map(w=>dailyQ(w,0))]);}
function trackDaily(q,ok){
  if(save.dv.done)return; // retakes on the same day don't change the schedule
  const w=q.word,s=save.vw[w];
  if(!ok)save.vw[w]={box:0,due:dayStr(1)};
  else if(!s)save.vw[w]={box:1,due:dayStr(SRS_INT[1])};
  else{const b=s.box+1;save.vw[w]=b>=SRS_INT.length?{box:5,due:"9999-12-31"}:{box:b,due:dayStr(SRS_INT[b])};}
  persist();
}
function renderDailyCard(){
  const p=dailyPlan();const done=p.done;const n=p.newW.length,r=p.revW.length;
  const themes=[...new Set(p.newW.map(w=>DW[w].theme))];
  $("openDaily").classList.toggle("done",done);
  $("dvBadge").innerHTML=done?"<span class='pill ok'>✓</span>":(n+r)?"<span class='pill' style='background:var(--v);color:#06302c'>"+(n+r)+"</span>":"";
  $("dvSub").textContent=done?"วันนี้เสร็จแล้ว 🎉 จำได้ "+dvStats().known+" คำ":(themes.length?themes[0]+" · ":"")+(n?n+" คำใหม่":"")+(r?(n?" + ":"")+"ทวน "+r+" คำ":"");
}
$("openDaily").onclick=openDaily;
$("dBack").onclick=()=>{renderHome();show("home")};
$("dStart").onclick=()=>start("daily");

/* ===== GAME ===== */
let G=null,tick=null;
function start(mode,game){
  G={mode,game,qs:build(mode,game),i:0,score:0,combo:0,maxCombo:0,lives:(mode==="practice"||mode==="review"||mode==="daily")?Infinity:3,correct:0,wrong:[],locked:false};
  document.documentElement.style.setProperty("--accent",MODES[mode].color);
  $("timerWrap").classList.toggle("hidden",!MODES[mode].time);
  show("play");renderQ();
}
function renderHUD(){
  $("prog").style.width=(G.i/G.qs.length*100)+"%";
  $("hearts").textContent=isFinite(G.lives)?"❤️".repeat(Math.max(0,G.lives))+"🖤".repeat(3-Math.max(0,G.lives)):(G.mode==="review"?"🔁 ทบทวน":G.mode==="daily"?"📅 Daily":"✏️ ฝึก");
  $("score").textContent=G.score;
  const c=$("combo");
  if(G.combo>=2){c.textContent="x"+G.combo+" COMBO 🔥";c.classList.add("on");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop")}
  else c.classList.remove("on");
}
function renderQ(){
  const q=G.qs[G.i];G.locked=false;renderHUD();
  $("tag").textContent=q.tag;
  const p=$("passage");
  if(q.passage){p.textContent=q.passage;p.classList.remove("hidden")}else p.classList.add("hidden");
  const qe=$("q");qe.className="q"+(q.big?" big":"");
  qe.innerHTML=q.html+(q.hint?"<div class='hint'>"+q.hint+"</div>":"");
  const box=$("opts");box.innerHTML="";
  q.opts.forEach((o,i)=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML="<span class='k'>"+"ABCD"[i]+"</span><span>"+esc(o.t)+"</span>";
    b.onclick=e=>answer(o,b,e);box.appendChild(b);
  });
  startTimer();
}
function startTimer(){
  clearInterval(tick);const T=MODES[G.mode].time;if(!T)return;
  G.t0=Date.now();const bar=$("timer");
  tick=setInterval(()=>{
    const left=Math.max(0,1-(Date.now()-G.t0)/(T*1000));
    bar.style.width=left*100+"%";
    bar.style.background=left>.5?"var(--ok)":left>.25?"var(--g)":"var(--bad)";
    if(left<=0){clearInterval(tick);answer(null,null,null)}
  },50);
}
function answer(o,btn,ev){
  if(G.locked)return;G.locked=true;clearInterval(tick);
  const q=G.qs[G.i];const T=MODES[G.mode].time;
  const all=[...$("opts").children];
  all.forEach((b,i)=>{if(q.opts[i].ok)b.classList.add("ok");else if(b!==btn)b.classList.add("dim")});
  if(G.mode==="daily")trackDaily(q,!!(o&&o.ok));else track(q,!!(o&&o.ok));
  if(o&&o.ok){
    G.combo++;G.correct++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const tb=T?Math.round(50*Math.max(0,1-(Date.now()-G.t0)/(T*1000))):30;
    const pts=100+tb+(G.combo>=2?G.combo*20:0);G.score+=pts;
    floatPts("+"+pts,ev);vib(20);
    fb(true,["เยี่ยม! 🎉","ถูกต้อง! ✨","Perfect! 💯","เก่งมาก! 🚀"][Math.random()*4|0],q.ex);
  }else{
    if(btn)btn.classList.add("bad");
    G.combo=0;G.lives--;vib([60,40,60]);
    G.wrong.push(q);
    fb(false,o?"ยังไม่ใช่ 😅":"หมดเวลา! ⏰","คำตอบ: "+q.ans+(q.ex?" — "+q.ex:""));
  }
  renderHUD();
}
function floatPts(t,ev){
  const f=document.createElement("div");f.className="float";f.textContent=t;
  const x=ev?ev.clientX:innerWidth/2,y=ev?ev.clientY:innerHeight/2;
  f.style.left=(x-30)+"px";f.style.top=(y-30)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),900);
}
function fb(good,t,p){
  const el=$("fb");el.className="fb show "+(good?"good":"wrong");
  $("fbT").textContent=t;$("fbP").textContent=p;
  $("next").textContent=(G.lives<=0||G.i>=G.qs.length-1)?"ดูผลลัพธ์":"ต่อไป";
}
$("next").onclick=()=>{
  $("fb").classList.remove("show");
  if(G.lives<=0||G.i>=G.qs.length-1)return finish();
  G.i++;renderQ();
};
$("quit").onclick=()=>{clearInterval(tick);$("fb").classList.remove("show");goBack()};

/* ===== END ===== */
function finish(){
  clearInterval(tick);
  const n=G.qs.length,answered=G.i+1,acc=G.correct/n;
  const stars=G.lives<=0?0:acc>=.9?3:acc>=.7?2:acc>=.5?1:0;
  const xp=Math.round(G.score/10)+(stars*10);
  const oldLv=lvOf(save.xp);
  if(G.mode==="review")save.lastReview=today();
  if(G.mode==="daily"&&save.dv.date===today())save.dv.done=true;
  save.xp+=xp;save.played++;save.correct+=G.correct;save.answered+=answered;
  save.maxCombo=Math.max(save.maxCombo,G.maxCombo);
  const bk=G.mode==="game"?"game-"+G.game:LEARN.includes(G.mode)?G.mode[0]+"-"+G.game:G.mode;save.stars[bk]=Math.max(save.stars[bk]||0,stars);const newBest=G.score>(save.best[bk]||0);if(newBest)save.best[bk]=G.score;
  const t=today(),y=dayStr(-1);
  if(save.last!==t){save.streak=save.last===y?save.streak+1:1;save.last=t}
  persist();
  const newLv=lvOf(save.xp);

  $("stars").textContent="⭐".repeat(stars)+"☆".repeat(3-stars);
  $("endTitle").textContent=G.lives<=0?"Game Over 💥":stars===3?"สุดยอด! 🏆":stars===2?"ดีมาก! 👏":stars===1?"ผ่านแล้ว! 💪":"ลองใหม่อีกนิดนะ 💪";
  $("endScore").textContent=G.score;
  $("endSub").textContent=(newBest?"🎉 สถิติใหม่! · ":"")+"ถูก "+G.correct+"/"+n+" ข้อ";
  $("eCorrect").textContent=G.correct+"/"+n;$("eCombo").textContent=G.maxCombo;$("eXp").textContent="+"+xp;
  const lu=$("lvup");
  if(newLv>oldLv){lu.textContent="⬆️ เลเวลอัป! Lv."+newLv+" · "+rankOf(newLv);lu.classList.remove("hidden")}else lu.classList.add("hidden");
  $("review").innerHTML=G.wrong.length?"<h3>"+(G.mode==="daily"?"คำที่พลาด · จะกลับมาให้ทวนพรุ่งนี้":"ทบทวนข้อที่พลาด")+"</h3>"+G.wrong.map(q=>
    "<div class='rv'>"+esc(q.plain)+"<br>✅ <b>"+esc(q.ans)+"</b>"+(q.ex?"<small>"+esc(q.ex)+"</small>":"")+"</div>").join(""):"";
  $("home2").textContent=G.mode==="practice"||G.mode==="lexam"?"กลับไปที่บทเรียน":G.mode==="uexam"?"กลับ Academy":G.mode==="review"?"กลับหน้าหลัก":G.mode==="daily"?"ดูคำศัพท์วันนี้":G.mode==="game"?"เลือกเกมอื่น":"กลับหน้าหลัก";
  show("end");
}
$("again").onclick=()=>start(G.mode,G.game);
function renderGames(){
  const L=$("gameList");L.innerHTML="";
  for(const k in GAMES){const g=GAMES[k];const b=document.createElement("button");b.className="mode gv";
    const best=save.best["game-"+k];
    b.innerHTML="<div class='ic'>"+g.emoji+"</div><div><b>"+esc(g.name)+"</b><small>"+g.words.length+" คำ · สุ่มรอบละ 12 คำ</small></div><div class='best'>"+(best?"สถิติ<br><b style='color:var(--text)'>"+best+"</b>":"")+"</div>";
    b.onclick=()=>start("game",k);L.appendChild(b);}
  SOON.forEach(n=>{const d=document.createElement("div");d.className="mode soon";
    d.innerHTML="<div class='ic'>🔒</div><div><b>"+esc(n)+"</b><small>เร็ว ๆ นี้</small></div>";L.appendChild(d);});
}
$("openGames").onclick=()=>{renderGames();show("games")};
$("gBack").onclick=()=>{renderHome();show("home")};
function goBack(){
  if(G&&(G.mode==="practice"||G.mode==="lexam"))return openLesson(G.game);
  if(G&&G.mode==="uexam"){renderAcademy();return show("academy");}
  if(G&&G.mode==="game"){renderGames();return show("games");}
  if(G&&G.mode==="daily")return openDaily();
  renderHome();show("home");
}
$("home2").onclick=goBack;
function starTxt(k){const s=save.stars[k];return s==null?"":"⭐".repeat(s)+"☆".repeat(3-s)}
function renderAcademy(){
  const ids=Object.keys(LESSONS);const read=ids.filter(i=>save.read[i]).length;const pass=ids.filter(i=>(save.stars["l-"+i]||0)>=1).length;
  $("acTxt").textContent="อ่าน "+read+"/"+ids.length+" · สอบผ่าน "+pass+"/"+ids.length;
  $("acBar").style.width=((read+pass)/(ids.length*2)*100)+"%";
  const box=$("unitList");box.innerHTML="";
  UNITS.forEach(u=>{
    const hd=document.createElement("div");hd.className="unit";
    hd.innerHTML="<b>"+esc(u.name)+"</b>";
    const ub=document.createElement("button");ub.className="ubtn";ub.textContent="📝 สอบ Unit "+(starTxt("u-"+u.id)||"");
    ub.onclick=()=>start("uexam",u.id);hd.appendChild(ub);box.appendChild(hd);
    u.lessons.forEach((id,n)=>{const l=LESSONS[id];const b=document.createElement("button");b.className="les";
      const st=starTxt("l-"+id);
      const ls=save.ls[id];const acc=ls&&ls.n?Math.round(ls.c/ls.n*100):null;
      b.innerHTML="<div class='ic'>"+l.e+"</div><div><b>"+esc(l.t)+"</b><small>"+esc(l.s)+"</small></div><div class='st'>"+(st||(save.read[id]?"✓ อ่านแล้ว":"ใหม่"))+(acc!=null?"<br>แม่น "+acc+"%":"")+(isWeak(id)?"<span class='weak'>🔁 ควรทวน</span>":"")+"</div>";
      b.onclick=()=>openLesson(id);box.appendChild(b);});
  });
}
function openLesson(id){
  const l=LESSONS[id];save.read[id]=1;persist();
  $("lTitle").innerHTML=l.e+" "+esc(l.t)+"<small>"+esc(l.s)+" · คลังข้อสอบ "+bankSize(id).toLocaleString()+" ข้อ</small>";
  $("lBody").innerHTML=l.c;
  $("lPractice").onclick=()=>start("practice",id);
  $("lExam").onclick=()=>start("lexam",id);
  show("lesson");
}
$("openAcademy").onclick=()=>{renderAcademy();show("academy")};
$("aBack").onclick=()=>{renderHome();show("home")};
$("lBack").onclick=()=>{renderAcademy();show("academy")};

renderHome();
</script>
</body>
</html>
